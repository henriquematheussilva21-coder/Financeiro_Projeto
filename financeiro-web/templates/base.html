<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Controle Financeiro{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-brand">💰 Financeiro</a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('listar') }}" class="{% if request.endpoint in ['listar', 'nova_transacao', 'editar_transacao'] %}active{% endif %}">Transações</a>
      <a href="{{ url_for('nova_transacao') }}" class="btn-nav">+ Nova</a>
    </div>
  </nav>

  <main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for categoria, mensagem in messages %}
            <div class="flash flash-{{ categoria }}">{{ mensagem }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

  </main>

</body>
</html>
